name: Build 3105 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Gỡ bỏ cấu hình Certificate lỗi của Xcode
        run: |
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ThreeOneOSFive.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' ThreeOneOSFive.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = "";/g' ThreeOneOSFive.xcodeproj/project.pbxproj

      - name: Thiết lập Xcode chính xác
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Tự động tìm Scheme và Biên dịch ứng dụng
        run: |
          mkdir -p build
          
          # Tìm tên Scheme thực tế đầu tiên trong dự án
          SCHEME_NAME=$(xcodebuild -list -project ThreeOneOSFive.xcodeproj | grep -A 10 "Schemes:" | tail -n +2 | tr -d ' ' | head -n 1)
          echo "Tìm thấy Scheme tên là: $SCHEME_NAME"
          
          # Chạy lệnh build với Scheme vừa tìm được
          xcodebuild clean build \
            -project ThreeOneOSFive.xcodeproj \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CONFIGURATION_BUILD_DIR=$(pwd)/build

      - name: Đóng gói thành file .ipa
        run: |
          mkdir -p Payload
          cp -r build/*.app Payload/
          zip -r 3105.ipa Payload

      - name: Tải file IPA lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3105-Unsigned-IPA
          path: 3105.ipa
